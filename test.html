<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>OfferHut — Voice Test</title><style>
body{font:16px system-ui;background:#111;color:#eee;max-width:680px;margin:24px auto;padding:16px}button,select{font:inherit;padding:12px;margin:4px;border-radius:8px}button:disabled{opacity:.5}#status{padding:16px;background:#252525;border-radius:8px}#log{white-space:pre-wrap;overflow-wrap:anywhere;font:13px monospace;color:#aaa}#chat p{padding:12px;background:#222;border-radius:8px;white-space:pre-wrap} .user{color:#8ed6ff}
</style></head><body><h2>OfferHut — Voice Test</h2><select id="lang"><option value="ru">Русский</option><option value="fi">Suomi</option><option value="en">English</option></select><button id="start">Начать разговор</button><button id="stop" disabled>Завершить</button><p id="status">Загрузка библиотеки…</p><p>Успешных реплик: <strong id="count">0</strong> / 10</p><div id="chat"></div><h3>Диагностика</h3><div id="log"></div>
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0/dist/ort.wasm.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@ricky0123/vad-web@0.0.31/dist/bundle.min.js"></script>
<script>
'use strict';
const API='https://offerhut-varaus.offerhut-fi.workers.dev';
const $=id=>document.getElementById(id);
let session=null, serial=0;
function log(text){ $('log').prepend(document.createTextNode(new Date().toLocaleTimeString()+' | '+text+'\n')); }
function status(text){ $('status').textContent=text; }
function message(role,text){const p=document.createElement('p');p.className=role;p.textContent=(role==='user'?'Вы: ':'ИИ: ')+text;$('chat').append(p);}
function alive(s){return session===s;}
function closeTracks(s){if(s.stream)s.stream.getTracks().forEach(t=>t.stop());}
function wav(samples){const b=new ArrayBuffer(44+samples.length*2),v=new DataView(b);const str=(p,t)=>{for(let i=0;i<t.length;i++)v.setUint8(p+i,t.charCodeAt(i));};str(0,'RIFF');v.setUint32(4,b.byteLength-8,true);str(8,'WAVE');str(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,16000,true);v.setUint32(28,32000,true);v.setUint16(32,2,true);v.setUint16(34,16,true);str(36,'data');v.setUint32(40,samples.length*2,true);for(let i=0;i<samples.length;i++){const x=Math.max(-1,Math.min(1,samples[i]));v.setInt16(44+2*i,x<0?x*32768:x*32767,true);}return new Uint8Array(b);}
function base64(bytes){let chunks=[];for(let i=0;i<bytes.length;i+=8192)chunks.push(String.fromCharCode(...bytes.subarray(i,i+8192)));return btoa(chunks.join(''));}
async function api(s,body){if(!alive(s))throw Error('Сессия закрыта');const c=new AbortController();s.request=c;const timer=setTimeout(()=>c.abort(),30000);try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),signal:c.signal});const d=await r.json();if(!r.ok||d.error)throw Error([r.status,d.error,d.syy].filter(Boolean).join(' '));return d;}finally{clearTimeout(timer);if(s.request===c)s.request=null;}}
async function speech(s,audio){if(!alive(s)||s.processing)return;s.processing=true;const t=performance.now();try{status('Распознавание… Не говорите до статуса «Слушаю».');log('Реплика '+(audio.length/16000).toFixed(2)+' с');if(audio.length>16000*90)throw Error('Реплика длиннее 90 секунд');const data=base64(wav(audio));const stt=await api(s,{mode:'transcribe',audio:{mimeType:'audio/wav',data}});if(!alive(s))return;log('STT '+((performance.now()-t)/1000).toFixed(2)+' с');const text=String(stt.text||'').trim();if(!text){log('Пустое распознавание');return;}message('user',text);s.history.push({role:'user',parts:[{text}]});status('Ответ ИИ…');const m=performance.now();const d=await api(s,{mode:'varaus',kieli:s.lang,kriteerit:s.criteria,vaihe:1,ehdokkaat:[],contents:s.history.slice(-30)});if(!alive(s))return;log('LLM '+((performance.now()-m)/1000).toFixed(2)+' с');if(d.nollaa)s.criteria={};else for(const [k,v] of Object.entries(d.kriteerit||{}))if(v!==''&&v!=null)s.criteria[k]=v;const answer=String(d.kysymys||'');if(answer){message('assistant',answer);s.history.push({role:'model',parts:[{text:answer}]});}else log('Ответ без текста: '+JSON.stringify(d));s.count++;$('count').textContent=s.count;log('Цикл '+s.count+': '+((performance.now()-t)/1000).toFixed(2)+' с');}catch(e){if(alive(s))log('ОШИБКА: '+e.message);}finally{s.processing=false;if(alive(s))status('Слушаю — говорите');}}
async function stop(){const s=session;if(!s)return;session=null;if(s.request)s.request.abort();closeTracks(s);$('stop').disabled=true;$('start').disabled=true;try{if(s.detector)await s.detector.pause();}catch(e){log('Stop: '+e.message);}finally{closeTracks(s);$('start').disabled=false;$('lang').disabled=false;status('Сессия завершена');}}
$('start').onclick=async()=>{if(session)return;const s={id:++serial,stream:null,detector:null,processing:false,history:[],criteria:{},count:0,lang:$('lang').value};session=s;$('start').disabled=true;$('stop').disabled=false;$('lang').disabled=true;$('count').textContent='0';$('chat').replaceChildren();status('Запрашиваю микрофон…');const t=performance.now();log('Вызов getUserMedia');try{const stream=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:true,autoGainControl:true,noiseSuppression:true}});if(!alive(s)){stream.getTracks().forEach(x=>x.stop());return;}s.stream=stream;log('Микрофон получен: '+((performance.now()-t)/1000).toFixed(2)+' с');status('Загрузка Silero…');const v=await vad.MicVAD.new({baseAssetPath:'https://cdn.jsdelivr.net/npm/@ricky0123/vad-web@0.0.31/dist/',onnxWASMBasePath:'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0/dist/',getStream:async()=>s.stream,onSpeechStart:()=>{if(alive(s)&&!s.processing){status('Говорите…');log('Начало речи');}},onVADMisfire:()=>{if(alive(s)&&!s.processing)status('Слушаю — говорите');},onSpeechEnd:audio=>{if(alive(s)&&!s.processing)void speech(s,audio);else if(alive(s))log('Речь во время обработки пропущена');}});s.detector=v;if(!alive(s)){await v.pause();closeTracks(s);return;}await v.start();if(!alive(s)){await v.pause();closeTracks(s);return;}log('Silero запущен');status('Слушаю — говорите');}catch(e){if(alive(s)){log('ОШИБКА запуска: '+e.message);await stop();}}};
$('stop').onclick=stop;
window.addEventListener('pagehide',()=>{if(session){closeTracks(session);session.request?.abort();session=null;}});
if(!window.isSecureContext||!navigator.mediaDevices?.getUserMedia||!window.vad?.MicVAD){$('start').disabled=true;status('Нужны HTTPS, доступ к микрофону и загрузка Silero CDN.');}else status('Готов к запуску');
</script></body></html>
