<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>OfferHut — Voice Test</title><style>
body{font:16px system-ui;background:#111;color:#eee;max-width:680px;margin:24px auto;padding:16px}button,select{font:inherit;padding:12px;margin:4px;border-radius:8px}button:disabled{opacity:.5}#status{padding:16px;background:#252525;border-radius:8px}#log{white-space:pre-wrap;overflow-wrap:anywhere;font:13px monospace;color:#aaa}#chat p{padding:12px;background:#222;border-radius:8px;white-space:pre-wrap} .user{color:#8ed6ff}
</style></head><body><h2>OfferHut — Voice Test</h2><select id="lang"><option value="ru">Русский</option><option value="fi">Suomi</option><option value="en">English</option></select><button id="start">Начать разговор</button><button id="stop" disabled>Завершить</button><p id="status">Загрузка библиотеки…</p><p>Успешных реплик: <strong id="count">0</strong> / 10</p><div id="chat"></div><h3>Диагностика</h3><div id="log"></div>
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0/dist/ort.wasm.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@ricky0123/vad-web@0.0.31/dist/bundle.min.js"></script>
<script src="js/api.js"></script><script src="js/voice-engine.js"></script><script src="js/search-controller.js"></script><script src="js/dialogue-engine.js"></script><script>
const $=id=>document.getElementById(id);let state,count=0,busy=false;const dialog=new DialogueEngine();function log(t){$('log').prepend(document.createTextNode(new Date().toLocaleTimeString()+' | '+t+'\n'));}function msg(t){const p=document.createElement('p');p.textContent=t;$('chat').append(p);}const voice=new VoiceEngine({onLog:log,onState:s=>{$('status').textContent=s;$('start').disabled=!!voice.session;$('stop').disabled=!voice.session;},canListen:()=>!busy,onText:async(text,signal)=>{busy=true;try{msg('Вы: '+text);$('status').textContent='Подождите. Печатаю ответ…';const d=await dialog.turn(state,text,$('lang').value,signal);if(!d)return;Object.assign(state.kriteerit,d.kriteerit);const missing=SearchController.missing(state.kriteerit);const answer=missing?d.kysymys:'Критерии получены. Тест завершён.';msg('ИИ: '+answer);state.historia.push({role:'model',parts:[{text:answer}]});$('count').textContent=++count;if(!missing)voice.stop();}finally{busy=false;}}});$('start').onclick=()=>{state={historia:[],kriteerit:{},ehdokkaat:[],vaihe:1};count=0;$('count').textContent=0;$('chat').replaceChildren();void voice.start();};$('stop').onclick=()=>{dialog.cancel();voice.stop();};window.addEventListener('pagehide',()=>{dialog.cancel();voice.stop();});$('status').textContent='Готов к запуску';</script></body></html>
